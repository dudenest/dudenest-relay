name: Rotate Docker Secrets

# Trigger: manual — when a secret value changes in GitHub Secrets
# Two-step swap: old→tmp (service gets new value) → recreate canonical name → swap back → cleanup
# Runner: Swarm self-hosted (has Docker socket)
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Secret to rotate"
        required: true
        type: choice
        options: [relay_key, relay_gdrive_client_secret, all]
        # NOTE: relay_jwt_secret is NOT a Docker secret — JWT_SECRET is env var via envsubst in deploy.yml

jobs:
  rotate:
    runs-on: [self-hosted, netol-swarm]
    steps:
      - name: Rotate secret(s)
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RELAY_GDRIVE_CLIENT_SECRET_B64: ${{ secrets.RELAY_GDRIVE_CLIENT_SECRET_B64 }}
          TARGET: ${{ inputs.secret_name }}
        run: |
          # Cleanup any orphan JWT secrets (migrated to env var)
          for s in relay_jwt_secret relay_jwt_secret_new; do
            docker service update --secret-rm "$s" dudenest-relay_relay 2>/dev/null || true
            docker secret rm "$s" 2>/dev/null || true
          done
          rotate_secret() {  # two-step swap: avoids docker secret rename (doesn't exist in Docker)
            local name=$1 value=$2 tmp="${1}_new"
            # Step 0: cleanup orphan _new from previous failed run
            docker service update --secret-rm "$tmp" dudenest-relay_relay 2>/dev/null || true
            docker secret rm "$tmp" 2>/dev/null || true
            # Step 1: create _new, switch service to use it (service reads new value via target=$name)
            printf '%s' "$value" | docker secret create "$tmp" -
            docker service update \
              --secret-rm "$name" \
              --secret-add "source=${tmp},target=${name}" \
              --constraint-add "node.role==manager" \
              dudenest-relay_relay
            docker secret rm "$name" 2>/dev/null || true  # old canonical name no longer needed
            # Step 2: recreate canonical name, swap service back to it, delete _new
            printf '%s' "$value" | docker secret create "$name" -
            docker service update \
              --secret-rm "$tmp" \
              --secret-add "source=${name},target=${name}" \
              --constraint-add "node.role==manager" \
              dudenest-relay_relay
            docker secret rm "$tmp"
            echo "✅ rotated: $name"
          }
          rotate_b64_secret() {  # same two-step swap for base64-encoded secrets
            local name=$1 b64value=$2 tmp="${1}_new"
            docker service update --secret-rm "$tmp" dudenest-relay_relay 2>/dev/null || true
            docker secret rm "$tmp" 2>/dev/null || true
            printf '%s' "$b64value" | base64 -d | docker secret create "$tmp" -
            docker service update \
              --secret-rm "$name" \
              --secret-add "source=${tmp},target=${name}" \
              --constraint-add "node.role==manager" \
              dudenest-relay_relay
            docker secret rm "$name" 2>/dev/null || true
            printf '%s' "$b64value" | base64 -d | docker secret create "$name" -
            docker service update \
              --secret-rm "$tmp" \
              --secret-add "source=${name},target=${name}" \
              --constraint-add "node.role==manager" \
              dudenest-relay_relay
            docker secret rm "$tmp"
            echo "✅ rotated: $name"
          }
          case "$TARGET" in
            relay_key)                  rotate_secret relay_key "$RELAY_KEY" ;;
            relay_gdrive_client_secret) rotate_b64_secret relay_gdrive_client_secret "$RELAY_GDRIVE_CLIENT_SECRET_B64" ;;
            all)
              rotate_secret relay_key "$RELAY_KEY"
              rotate_b64_secret relay_gdrive_client_secret "$RELAY_GDRIVE_CLIENT_SECRET_B64"
              ;;
          esac
