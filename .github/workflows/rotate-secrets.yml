name: Rotate Docker Secrets

# Trigger: manual — when a secret value changes in GitHub Secrets
# Updates the Docker secret in-place (create versioned → update service → remove old)
# Runner: Swarm self-hosted (has Docker socket)
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Secret to rotate"
        required: true
        type: choice
        options: [relay_key, relay_jwt_secret, relay_gdrive_client_secret, all]

jobs:
  rotate:
    runs-on: [self-hosted, netol-swarm]
    steps:
      - name: Rotate secret(s)
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RELAY_JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
          RELAY_GDRIVE_CLIENT_SECRET_B64: ${{ secrets.RELAY_GDRIVE_CLIENT_SECRET_B64 }}
          TARGET: ${{ inputs.secret_name }}
        run: |
          rotate_secret() {  # create tmp → update service → rm old → rename tmp
            local name=$1 value=$2 tmp="${1}_new"
            printf '%s' "$value" | docker secret create "$tmp" -
            docker service update \
              --secret-rm  "$name" \
              --secret-add "source=${tmp},target=${name}" \
              --constraint-add "node.role==manager" \
              dudenest-relay_relay
            docker secret rm "$name"
            docker secret inspect "$tmp" -f '{{.ID}}' | xargs -I{} docker secret update --name "$name" {} 2>/dev/null || \
              (printf '%s' "$value" | docker secret create "$name" - && docker secret rm "$tmp")
            echo "✅ rotated: $name"
          }
          rotate_b64_secret() {
            local name=$1 b64value=$2 tmp="${1}_new"
            printf '%s' "$b64value" | base64 -d | docker secret create "$tmp" -
            docker service update \
              --secret-rm  "$name" \
              --secret-add "source=${tmp},target=${name}" \
              dudenest-relay_relay
            docker secret rm "$name"
            printf '%s' "$b64value" | base64 -d | docker secret create "$name" - && docker secret rm "$tmp"
            echo "✅ rotated: $name"
          }
          case "$TARGET" in
            relay_key)                rotate_secret relay_key "$RELAY_KEY" ;;
            relay_jwt_secret)         rotate_secret relay_jwt_secret "$RELAY_JWT_SECRET" ;;
            relay_gdrive_client_secret) rotate_b64_secret relay_gdrive_client_secret "$RELAY_GDRIVE_CLIENT_SECRET_B64" ;;
            all)
              rotate_secret relay_key "$RELAY_KEY"
              rotate_secret relay_jwt_secret "$RELAY_JWT_SECRET"
              rotate_b64_secret relay_gdrive_client_secret "$RELAY_GDRIVE_CLIENT_SECRET_B64"
              ;;
          esac
