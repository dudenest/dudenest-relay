name: Build Relay Binaries

on:
  push:
    branches: [main, feat/storage-replica]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, feat/storage-replica]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # Test on native Go (github-hosted)
  # ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      GONOSUMDB: "*"
      GOFLAGS: "-mod=mod"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Configure git auth for Go modules
        run: git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: Download dependencies
        run: go mod tidy
      - name: Run tests
        run: go test ./... -v -race

  # ─────────────────────────────────────────────
  # Cross-compile for all target platforms
  # ─────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      GONOSUMDB: "*"
      GOFLAGS: "-mod=mod"
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64,  goarm: "",  artifact: relay-linux-amd64,       desc: "Linux x86_64 (VM, VPS, Desktop)"}
          - {goos: linux,   goarch: arm64,  goarm: "",  artifact: relay-linux-arm64,       desc: "Linux ARM64 (Raspberry Pi 4/5, Apple Silicon VM)"}
          - {goos: linux,   goarch: arm,    goarm: "7", artifact: relay-linux-armv7,       desc: "Linux ARMv7 (Raspberry Pi 3B, Zero 2W)"}
          - {goos: darwin,  goarch: amd64,  goarm: "",  artifact: relay-darwin-amd64,      desc: "macOS Intel"}
          - {goos: darwin,  goarch: arm64,  goarm: "",  artifact: relay-darwin-arm64,      desc: "macOS Apple Silicon"}
          - {goos: windows, goarch: amd64,  goarm: "",  artifact: relay-windows-amd64.exe, desc: "Windows x86_64"}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Configure git auth for Go modules
        run: git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: Download dependencies
        run: go mod tidy
      - name: Build ${{ matrix.desc }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"  # static binary, no CGO deps (SQLite via pure-go driver for cross-compile)
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }}" \
            -o dist/${{ matrix.artifact }} \
            ./cmd/relay/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 30

  # ─────────────────────────────────────────────
  # Docker multi-arch image (amd64 + arm64 + armv7)
  # ─────────────────────────────────────────────
  docker:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dudenest/dudenest-relay
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Deploy to NETOL Docker Swarm (main only)
  # Architecture: ns2 HAProxy → Swarm routing mesh :8086 → relay container
  # Runner: self-hosted on Swarm (has Docker socket access)
  # Secrets: created automatically from GitHub Secrets — no manual docker secret create
  # Required GitHub Secrets:
  #   RELAY_KEY                      — master key hex (32 bytes), encrypts DB at rest
  #   RELAY_JWT_SECRET               — shared JWT secret with dudenest-backend
  #   RELAY_GDRIVE_CLIENT_SECRET_B64 — base64(gdrive_client_secret.json), OAuth app registration
  # NOT a secret: user GDrive tokens are stored at runtime in relay_maps volume (per user)
  # ─────────────────────────────────────────────
  deploy-swarm:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, netol-swarm]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (so --with-registry-auth distributes credentials to all Swarm nodes)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Ensure Docker secrets exist (idempotent)
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RELAY_JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
          RELAY_GDRIVE_CLIENT_SECRET_B64: ${{ secrets.RELAY_GDRIVE_CLIENT_SECRET_B64 }}
        run: |
          ensure_secret() {  # create secret if not exists; skip if exists (rotate via rotate-secrets workflow)
            local name=$1 value=$2
            if docker secret inspect "$name" > /dev/null 2>&1; then
              echo "ℹ️  secret exists: $name"
            else
              printf '%s' "$value" | docker secret create "$name" -
              echo "✅ created secret: $name"
            fi
          }
          ensure_secret relay_key "$RELAY_KEY"  # relay_jwt_secret removed — JWT_SECRET is env var via envsubst
          printf '%s' "$RELAY_GDRIVE_CLIENT_SECRET_B64" | base64 -d | docker secret create relay_gdrive_client_secret - 2>/dev/null || echo "ℹ️  secret exists: relay_gdrive_client_secret"

      - name: Deploy relay stack
        env:
          JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
          GDRIVE_WEB_CLIENT_ID: ${{ secrets.GDRIVE_WEB_CLIENT_ID }}
          GDRIVE_WEB_CLIENT_SECRET: ${{ secrets.GDRIVE_WEB_CLIENT_SECRET }}
          RELAY_PUBLIC_URL: "https://relay.dudenest.com"  # Swarm relay public URL
        run: |
          envsubst < deploy/relay-stack.yml > /tmp/relay-stack-resolved.yml
          docker stack deploy \
            --with-registry-auth \
            --resolve-image always \
            --compose-file /tmp/relay-stack-resolved.yml \
            dudenest-relay

      - name: Verify deployment
        run: |
          sleep 20
          docker service ls --filter name=dudenest-relay_relay
          STATUS=$(docker service inspect dudenest-relay_relay -f '{{.UpdateStatus.State}}' 2>/dev/null || echo "new")
          echo "Update status: $STATUS"
          docker service ps dudenest-relay_relay --no-trunc | head -5

  # ─────────────────────────────────────────────
  # Deploy amd64 binary to relay-poc VM via ZeroTier (DooD)
  # Requires: SSH_RELAY_KEY secret
  # ─────────────────────────────────────────────
  deploy-relay-poc:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, netol-swarm]
    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: relay-linux-amd64
          path: dist/

      - name: Deploy to relay-poc via ZeroTier (DooD)
        env:
          RELAY_JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GDRIVE_WEB_CLIENT_ID: ${{ secrets.GDRIVE_WEB_CLIENT_ID }}
          GDRIVE_WEB_CLIENT_SECRET: ${{ secrets.GDRIVE_WEB_CLIENT_SECRET }}
        run: |
          mkdir -p .ssh
          printf '%s\n' "${{ secrets.SSH_RELAY_KEY }}" > .ssh/id_relay
          chmod 600 .ssh/id_relay
          printf '%s\n' \
            '|1|UuvIaaNQuir5tDQ8W+KQW1pdeFA=|AbnuhorydCSV+fIqEELFQrwnDEk= ssh-rsa ' \
            '|1|V9gcNyA5Zi6WhVJujqTIkE1C16M=|/zHsBw2Nti0ZD+ROap3SWSkOJuM= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEYudfc8afzLb6qXA+tk4LDHB5aTfxFDiuCDOYBzj9x51e13i+34+vWj4UbUd/8vNLezNrJ/B9Ojl+9B2xhG9F0=' \
            '|1|jP6cS821wSvnH01mYQuKa1+HqjE=|uS2B2nlW73jCh14qFoCqOwPePfI= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILOMuMu0FwC7XN/zMLMQXAjyOyP1ovyTFwa/gM0kBgt8' \
            > .ssh/known_hosts
          chmod 644 .ssh/known_hosts
          # Generate relay.env with current secrets from GitHub (overwrites existing on VM)
          printf 'RELAY_KEY=%s\nGDRIVE_WEB_CLIENT_ID=%s\nGDRIVE_WEB_CLIENT_SECRET=%s\nJWT_SECRET=%s\nRELAY_PUBLIC_URL=https://relay.dudenest.com\n' \
            "${RELAY_KEY}" "${GDRIVE_WEB_CLIENT_ID}" "${GDRIVE_WEB_CLIENT_SECRET}" "${RELAY_JWT_SECRET}" > relay.env
          DEPLOYER="deployer-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -f $DEPLOYER 2>/dev/null || true
          docker create --name $DEPLOYER --network host alpine:latest sleep 300
          docker cp dist $DEPLOYER:/dist
          docker cp .ssh $DEPLOYER:/root/.ssh
          docker cp relay.env $DEPLOYER:/relay.env
          docker start $DEPLOYER
          docker exec $DEPLOYER sh -c "
            apk add --no-cache openssh-client && \
            chmod 600 /root/.ssh/id_relay && \
            chmod +x /dist/relay-linux-amd64 && \
            scp -i /root/.ssh/id_relay -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes /relay.env root@10.51.1.119:/root/.config/dudenest/relay.env && \
            scp -i /root/.ssh/id_relay -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes /dist/relay-linux-amd64 root@10.51.1.119:/tmp/relay-new && \
            ssh -i /root/.ssh/id_relay -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 'mv /tmp/relay-new /usr/local/bin/relay && systemctl restart relay.service && systemctl is-active relay.service'
          "
          docker rm -f $DEPLOYER

  # ─────────────────────────────────────────────
  # GitHub Release with all binaries (tags only)
  # ─────────────────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist/
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/relay-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
