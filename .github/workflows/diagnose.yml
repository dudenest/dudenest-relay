name: Diagnose Swarm
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, netol-swarm]
    steps:
      - name: All services
        run: |
          echo "=== STACKS ===" && docker stack ls
          echo "=== ALL SERVICES ===" && docker service ls
          echo "=== BACKEND ===" && docker service ps dudenest-backend_server --no-trunc 2>/dev/null || echo "NOT FOUND"
          echo "=== RELAY ===" && docker service ps dudenest-relay_relay --no-trunc 2>/dev/null || echo "NOT FOUND"
          echo "=== BACKUP ===" && docker service ps dudenest-backup_backup --no-trunc 2>/dev/null || echo "NOT FOUND"
          echo "=== NETWORK ===" && docker network ls | grep dudenest || true
          echo "=== BACKEND LOGS (last 20) ===" && docker service logs dudenest-backend_server --tail 20 2>/dev/null || echo "no logs"
          echo "=== RELAY JWT_SECRET check ===" && docker service inspect dudenest-relay_relay --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' | grep JWT_SECRET | sed 's/JWT_SECRET=\(.\{0,8\}\).*/JWT_SECRET=\1...REDACTED/'
          echo "=== BACKEND JWT_SECRET check ===" && docker service inspect dudenest-backend_server --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' | grep JWT_SECRET | sed 's/JWT_SECRET=\(.\{0,8\}\).*/JWT_SECRET=\1...REDACTED/'
          echo "=== RELAY LOGS (last 50) ===" && docker service logs dudenest-relay_relay --tail 50 --timestamps 2>/dev/null || echo "no logs"
          echo "=== WHICH NODE IS RUNNER ===" && docker info --format '{{.Name}}'
          echo "=== RELAY TASK NODE ===" && docker service ps dudenest-relay_relay --filter "desired-state=running" --format '{{.Node}} {{.CurrentState}} {{.ID}}'
          echo "=== RELAY LOGS via service logs ===" && docker service logs dudenest-relay_relay --tail 50 --timestamps 2>&1 | tail -30 || echo "no service logs"
          echo "=== RELAY CONTAINER LOCAL ===" && RELAY_CONTAINER=$(docker ps --filter name=dudenest-relay_relay --format '{{.ID}}' | head -1) && echo "local container id: $RELAY_CONTAINER"
          if [ -n "$RELAY_CONTAINER" ]; then
            echo "--- env JWT_SECRET ---" && docker exec $RELAY_CONTAINER env | grep JWT_SECRET | sed 's/JWT_SECRET=\(.\{0,12\}\).*/JWT_SECRET=\1.../'
            echo "--- maps dir ---" && docker exec $RELAY_CONTAINER ls -la /var/lib/dudenest/maps/ 2>/dev/null || echo "maps dir missing"
            echo "--- relay_creds.json ---" && docker exec $RELAY_CONTAINER cat /var/lib/dudenest/maps/relay_creds.json 2>/dev/null | sed 's/"relay_secret":"[^"]*"/"relay_secret":"REDACTED"/' || echo "no relay_creds.json"
            echo "--- maps files ---" && docker exec $RELAY_CONTAINER ls -la /var/lib/dudenest/maps/*.json 2>/dev/null || echo "no json files in maps"
            echo "--- health ---" && docker exec $RELAY_CONTAINER wget -qO- http://localhost:8086/health 2>/dev/null || echo "health failed"
          else
            echo "Relay is on a different node - trying via Swarm routing mesh"
            echo "--- health via mesh :8086 ---" && wget -qO- http://localhost:8086/health 2>/dev/null || echo "health via mesh failed"
            echo "--- files 401 test ---" && wget -qO- --header "Authorization: Bearer invalid" http://localhost:8086/files 2>&1 | head -5 || true
          fi
          echo "=== BACKEND LOGS auth errors ===" && docker service logs dudenest-backend_server --tail 100 --timestamps 2>&1 | grep -i "401\|unauth\|jwt\|relay\|register\|error" | tail -20 || echo "no backend logs"
          echo "=== OVERLAY NETWORK IPAM ===" && docker network inspect dudenest --format '{{json .IPAM}}' 2>/dev/null || echo "no dudenest network"
          echo "=== OVERLAY NETWORK CONTAINERS ===" && docker network inspect dudenest --format '{{range .Containers}}{{.Name}} {{.IPv4Address}} {{println}}{{end}}' 2>/dev/null || echo "no containers on dudenest"
          echo "=== BACKUP STATUS ===" && docker service ls --filter name=dudenest-backup && docker service ps dudenest-backup_backup --no-trunc 2>/dev/null | head -5

      - name: Diagnose relay-poc (10.51.1.119)
        env:
          SSH_RELAY_KEY_B64: ${{ secrets.SSH_RELAY_KEY }}
        run: |
          mkdir -p /tmp/diag-ssh
          printf '%s\n' "$SSH_RELAY_KEY_B64" > /tmp/diag-ssh/id_relay
          chmod 600 /tmp/diag-ssh/id_relay
          printf '%s\n' \
            '|1|UuvIaaNQuir5tDQ8W+KQW1pdeFA=|AbnuhorydCSV+fIqEELFQrwnDEk= ssh-rsa ' \
            '|1|V9gcNyA5Zi6WhVJujqTIkE1C16M=|/zHsBw2Nti0ZD+ROap3SWSkOJuM= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEYudfc8afzLb6qXA+tk4LDHB5aTfxFDiuCDOYBzj9x51e13i+34+vWj4UbUd/8vNLezNrJ/B9Ojl+9B2xhG9F0=' \
            '|1|jP6cS821wSvnH01mYQuKa1+HqjE=|uS2B2nlW73jCh14qFoCqOwPePfI= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILOMuMu0FwC7XN/zMLMQXAjyOyP1ovyTFwa/gM0kBgt8' \
            > /tmp/diag-ssh/known_hosts
          chmod 644 /tmp/diag-ssh/known_hosts
          echo "=== relay-poc: systemd service status ===" && \
            ssh -i /tmp/diag-ssh/id_relay -o UserKnownHostsFile=/tmp/diag-ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 \
              'systemctl is-active relay.service && systemctl status relay.service --no-pager -l | tail -20' 2>&1 || echo "ssh failed"
          echo "=== relay-poc: relay binary version ===" && \
            ssh -i /tmp/diag-ssh/id_relay -o UserKnownHostsFile=/tmp/diag-ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 \
              'ls -lh /usr/local/bin/relay && /usr/local/bin/relay version 2>/dev/null || echo "no version flag"' 2>&1 || echo "ssh failed"
          echo "=== relay-poc: config dir ===" && \
            ssh -i /tmp/diag-ssh/id_relay -o UserKnownHostsFile=/tmp/diag-ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 \
              'ls -la /root/.config/dudenest/ 2>/dev/null || echo "no config dir"' 2>&1 || echo "ssh failed"
          echo "=== relay-poc: relay_creds.json ===" && \
            ssh -i /tmp/diag-ssh/id_relay -o UserKnownHostsFile=/tmp/diag-ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 \
              'cat /root/.config/dudenest/relay_creds.json 2>/dev/null | sed "s/\"relay_secret\":\"[^\"]*\"/\"relay_secret\":\"REDACTED\"/" || echo "no relay_creds.json"' 2>&1 || echo "ssh failed"
          echo "=== relay-poc: relay.env keys present ===" && \
            ssh -i /tmp/diag-ssh/id_relay -o UserKnownHostsFile=/tmp/diag-ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 \
              'cat /root/.config/dudenest/relay.env 2>/dev/null | sed "s/=.*/=REDACTED/" || echo "no relay.env"' 2>&1 || echo "ssh failed"
          echo "=== relay-poc: last 30 journal lines ===" && \
            ssh -i /tmp/diag-ssh/id_relay -o UserKnownHostsFile=/tmp/diag-ssh/known_hosts -o StrictHostKeyChecking=yes root@10.51.1.119 \
              'journalctl -u relay.service -n 30 --no-pager 2>/dev/null || tail -30 /var/log/relay.log 2>/dev/null || echo "no logs"' 2>&1 || echo "ssh failed"
          rm -rf /tmp/diag-ssh

      - name: JWT live test (relay-poc + Swarm)
        env:
          RELAY_JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
        run: |
          python3 -c "
          import hmac as _hmac, hashlib, base64, json, time, os, urllib.request, urllib.error
          secret = os.environ.get('RELAY_JWT_SECRET', '')
          if not secret:
              print('ERROR: RELAY_JWT_SECRET not set')
              exit(1)
          h = base64.urlsafe_b64encode(json.dumps({'alg':'HS256','typ':'JWT'}).encode()).rstrip(b'=').decode()
          p = base64.urlsafe_b64encode(json.dumps({'sub':'test-diag-user','exp':int(time.time())+300}).encode()).rstrip(b'=').decode()
          msg = h + '.' + p
          mac = _hmac.new(secret.encode(), msg.encode(), hashlib.sha256)
          sig = base64.urlsafe_b64encode(mac.digest()).rstrip(b'=').decode()
          token = msg + '.' + sig
          print('JWT (first 40): ' + token[:40] + '...')
          targets = [
              ('relay-poc', 'http://10.51.1.119:8086'),
              ('swarm', 'http://10.51.1.221:8086'),
          ]
          for name, base in targets:
              for path in ['/health', '/files', '/providers']:
                  url = base + path
                  try:
                      req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
                      resp = urllib.request.urlopen(req, timeout=5)
                      body = resp.read()[:300].decode('utf-8', 'ignore')
                      print(f'[{name}] GET {path} -> {resp.status}: {body}')
                  except urllib.error.HTTPError as e:
                      body = e.read()[:200].decode('utf-8', 'ignore')
                      print(f'[{name}] GET {path} -> HTTP {e.code}: {body}')
                  except Exception as e:
                      print(f'[{name}] GET {path} -> ERROR: {e}')
          "

      - name: JWT compare secrets prefix (RELAY vs DUDENEST)
        env:
          RELAY_JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
          DUDENEST_JWT_SECRET: ${{ secrets.DUDENEST_JWT_SECRET }}
        run: |
          python3 -c "
          import os
          relay = os.environ.get('RELAY_JWT_SECRET', '')
          dudenest = os.environ.get('DUDENEST_JWT_SECRET', '')
          print('RELAY_JWT_SECRET   first 12 chars: ' + relay[:12] + '...')
          print('DUDENEST_JWT_SECRET first 12 chars: ' + dudenest[:12] + '...')
          print('MATCH (first 16): ' + str(relay[:16] == dudenest[:16]))
          print('FULL MATCH: ' + str(relay == dudenest))
          print('relay len=' + str(len(relay)) + ' dudenest len=' + str(len(dudenest)))
          "
