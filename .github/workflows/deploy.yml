name: Deploy Relay Stack

# Trigger: manual or called by build.yml after image push
on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    name: Deploy to Swarm
    runs-on: [self-hosted, netol-swarm]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Diagnose current state
        run: |
          echo "=== services ===" && docker service ls | grep -E "dudenest-relay|REPLICAS" || true
          echo "=== relay tasks ===" && docker service ps dudenest-relay_relay --no-trunc 2>/dev/null || true
          echo "=== stacks ===" && docker stack ls || true

      - name: Full stack remove (clean slate)
        run: |
          docker stack rm dudenest-relay 2>/dev/null || true
          echo "Waiting for all tasks to stop..."
          for i in $(seq 1 20); do
            COUNT=$(docker service ls --filter name=dudenest-relay_relay -q 2>/dev/null | wc -l)
            [ "$COUNT" -eq 0 ] && echo "Service gone" && break
            sleep 3
          done
          sleep 5

      - name: Cleanup orphan JWT Docker secrets
        run: |
          for s in relay_jwt_secret relay_jwt_secret_new; do
            docker secret rm "$s" 2>/dev/null || true
          done

      - name: Deploy relay stack
        env:
          JWT_SECRET: ${{ secrets.RELAY_JWT_SECRET }}
          GDRIVE_WEB_CLIENT_ID: ${{ secrets.GDRIVE_WEB_CLIENT_ID }}
          GDRIVE_WEB_CLIENT_SECRET: ${{ secrets.GDRIVE_WEB_CLIENT_SECRET }}
        run: |
          envsubst < deploy/relay-stack.yml > /tmp/relay-stack-resolved.yml
          docker stack deploy \
            --with-registry-auth \
            --compose-file /tmp/relay-stack-resolved.yml \
            dudenest-relay

      - name: Wait and verify
        run: |
          sleep 20
          docker service ls | grep dudenest-relay
          docker service ps dudenest-relay_relay --no-trunc | head -5
